version: "3.9"

services:

  # ── FastAPI Backend ──────────────────────────────────────
  app:
    build: ./backend
    container_name: fastapi_app

    ports:
      - "8000:8000"

    depends_on:
      - db

    volumes:
      - ./backend:/app

    restart: always

  # ── MySQL Database ───────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: mysql_db

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3307:3306"

    restart: always

  # ── React Frontend (Nginx) ───────────────────────────────
  frontend:
    build: ./frontend
    container_name: react_frontend

    ports:
      - "3000:80"

    depends_on:
      - app

    restart: always